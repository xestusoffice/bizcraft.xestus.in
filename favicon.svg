<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="grad-facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="grad-facet2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <rect width="512" height="512" rx="128" fill="#090D16" />
  
  <!-- Outer glowing craft polygon -->
  <g filter="url(#glow)">
    <polygon points="256,64 432,160 432,352 256,448 80,352 80,160" fill="url(#grad-main)" />
  </g>

  <!-- Facets for 3D crystalline craft feel -->
  <polygon points="256,64 432,160 256,256" fill="rgba(255, 255, 255, 0.22)" />
  <polygon points="432,160 432,352 256,256" fill="url(#grad-facet1)" opacity="0.85" />
  <polygon points="432,352 256,448 256,256" fill="#312E81" />
  <polygon points="256,448 80,352 256,256" fill="url(#grad-facet2)" opacity="0.9" />
  <polygon points="80,352 80,160 256,256" fill="#1E1B4B" />
  <polygon points="80,160 256,64 256,256" fill="rgba(255, 255, 255, 0.35)" />

  <!-- Inner Craft Core Emblem -->
  <circle cx="256" cy="256" r="64" fill="#090D16" />
  <polygon points="256,212 294,278 218,278" fill="url(#grad-gold)" />
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
</svg>
